server:
  port: 8080
  servlet:
    context-path: /api/v1
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: yanzhi-backend
  
  # 数据源配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yanzhi_future?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: root
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
  
  # Redis配置
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 3000
    lettuce:
      pool:
        max-active: 8
        max-wait: -1
        max-idle: 8
        min-idle: 0
  
  # MongoDB配置
  data:
    mongodb:
      host: localhost
      port: 27017
      database: yanzhi_future
      username: 
      password:
  
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
  
  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.yanzhi.backend.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Redisson配置
redisson:
  address: redis://localhost:6379
  database: 0
  password:

# 日志配置
logging:
  level:
    root: INFO
    com.yanzhi.backend: DEBUG
    com.yanzhi.backend.mapper: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
  file:
    name: logs/yanzhi-backend.log

# Swagger配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# 自定义配置
yanzhi:
  # Python算法服务配置
  python-service:
    base-url: http://localhost:5000
    timeout: 30000
    
  # JWT配置
  jwt:
    secret: yanzhi-future-secret-key-for-jwt-token-generation-2024
    expiration: 86400000 # 24小时
    
  # 文件存储配置
  file:
    upload-path: /data/uploads
    max-size: 104857600 # 100MB
    allowed-types: jpg,jpeg,png,gif,mp3,wav,txt,docx,doc,pdf
    
  # OSS配置（阿里云对象存储）
  oss:
    enabled: true
    endpoint: https://oss-cn-hangzhou.aliyuncs.com
    access-key-id: your-access-key-id
    access-key-secret: your-access-key-secret
    bucket-name: yanzhi-future
  
  # 微信小程序配置
  wechat:
    appid: your-wechat-appid
    secret: your-wechat-secret
    
  # AI服务配置
  ai:
    speech-recognition:
      enabled: true
      model: whisper-large-v3
    speech-synthesis:
      enabled: true
      model: edge-tts
    translation:
      enabled: true
      model: gpt-4
    nlp:
      enabled: true
      model: gpt-4

# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always