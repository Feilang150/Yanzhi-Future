version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: yanzhi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: yanzhi_future
      MYSQL_USER: yanzhi
      MYSQL_PASSWORD: yanzhi123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - yanzhi-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # MongoDB数据库
  mongodb:
    image: mongo:7.0
    container_name: yanzhi-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: yanzhi_future
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./database/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
    networks:
      - yanzhi-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      timeout: 20s
      retries: 10

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: yanzhi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - yanzhi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Java后端服务
  java-backend:
    build:
      context: ./backend/java
      dockerfile: Dockerfile
    container_name: yanzhi-java-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/yanzhi_future?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8
      SPRING_DATASOURCE_USERNAME: yanzhi
      SPRING_DATASOURCE_PASSWORD: yanzhi123
      SPRING_DATA_MONGODB_HOST: mongodb
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: yanzhi_future
      SPRING_DATA_MONGODB_USERNAME: admin
      SPRING_DATA_MONGODB_PASSWORD: admin123
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      YANZHI_PYTHON_SERVICE_BASE_URL: http://python-ai-service:5000
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-ai-service:
        condition: service_started
    networks:
      - yanzhi-network
    volumes:
      - java_logs:/app/logs

  # Python AI服务
  python-ai-service:
    build:
      context: ./backend/python
      dockerfile: Dockerfile
    container_name: yanzhi-python-ai-service
    environment:
      MONGODB_URL: mongodb://admin:admin123@mongodb:27017/
      MONGODB_DATABASE: yanzhi_future
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your-openai-api-key}
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - yanzhi-network
    volumes:
      - python_logs:/app/logs
      - python_models:/app/models
      - python_cache:/app/cache

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: yanzhi-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - java-backend
      - python-ai-service
    networks:
      - yanzhi-network

volumes:
  mysql_data:
  mongodb_data:
  redis_data:
  java_logs:
  python_logs:
  python_models:
  python_cache:

networks:
  yanzhi-network:
    driver: bridge